name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release-preflight:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify release metadata
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          version_code="$(tr -d '\r\n' < VERSION_CODE)"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must be a stable x.y.z value for release, got: $version" >&2
            exit 1
          fi

          if [[ ! "$version_code" =~ ^[1-9][0-9]*$ ]]; then
            echo "VERSION_CODE must be a positive integer, got: $version_code" >&2
            exit 1
          fi

          if [[ "$EVENT_NAME" == "push" && "$REF_NAME" != "v$version" ]]; then
            echo "Release tag $REF_NAME does not match VERSION v$version." >&2
            exit 1
          fi

          if [[ ! -f LICENSE ]]; then
            echo "Product LICENSE is missing. Resolve the M0 product-license decision before release." >&2
            exit 1
          fi

          if ! grep -Fq "## $version" CHANGELOG.md; then
            echo "CHANGELOG.md must contain a final ## $version release section." >&2
            exit 1
          fi

      - name: Confirm Inno Setup licensing posture
        shell: bash
        env:
          NATSX_INNO_LICENSE_CONFIRMED: ${{ vars.NATSX_INNO_LICENSE_CONFIRMED }}
        run: |
          set -euo pipefail
          value="${NATSX_INNO_LICENSE_CONFIRMED,,}"
          if [[ "$value" != "true" ]]; then
            echo "Set NATSX_INNO_LICENSE_CONFIRMED=true only after confirming this release is covered by permitted Inno Setup usage or a commercial license." >&2
            exit 1
          fi

      - name: Require physical release approval for this exact commit
        shell: bash
        env:
          APPROVED_SHA: ${{ vars.NATSX_PHYSICAL_RELEASE_APPROVED_SHA }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ -z "$APPROVED_SHA" ]]; then
            echo "NATSX_PHYSICAL_RELEASE_APPROVED_SHA is not configured." >&2
            exit 1
          fi

          if [[ "$APPROVED_SHA" != "$RELEASE_SHA" ]]; then
            echo "Physical release approval is for $APPROVED_SHA, but this release is $RELEASE_SHA." >&2
            echo "Run clean-install/soak/sleep/CPU/battery/upgrade/uninstall validation on this exact commit before release." >&2
            exit 1
          fi
  android-release:
    needs: release-preflight
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Decode Android release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/natsx-release.keystore

      - name: Lint Android
        run: gradle -p android :app:lintRelease --stacktrace

      - name: Test Android
        run: gradle -p android :app:testDebugUnitTest --stacktrace

      - name: Verify Android signing
        env:
          NATSX_RELEASE_STORE_FILE: ${{ github.workspace }}/android/natsx-release.keystore
          NATSX_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NATSX_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NATSX_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p android :app:verifyReleaseSigning --stacktrace

      - name: Assemble signed Android release
        env:
          NATSX_RELEASE_STORE_FILE: ${{ github.workspace }}/android/natsx-release.keystore
          NATSX_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NATSX_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NATSX_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p android :app:assembleRelease --stacktrace

      - name: Verify final Android APK signature
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk

      - name: Stage Android release and checksum
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          mkdir -p artifacts/android
          output="artifacts/android/natsx-controller-android-$version.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$output"
          hash="$(sha256sum "$output" | awk '{print $1}')"
          printf '%s  %s\n' "$hash" "$(basename "$output")" > "$output.sha256"

      - name: Upload signed Android APK
        uses: actions/upload-artifact@v4
        with:
          name: natsx-controller-android-release
          path: artifacts/android/*
          if-no-files-found: error

      - name: Remove release keystore
        if: always()
        run: rm -f android/natsx-release.keystore

  windows-release:
    needs: release-preflight
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Fetch HIDMaestro SDK
        shell: pwsh
        run: ./windows/eng/fetch-hidmaestro.ps1

      - name: Restore WDK validation tools
        shell: pwsh
        run: nuget restore windows/driver/aoa-bootstrap/packages.config -PackagesDirectory windows/driver/aoa-bootstrap/packages -NonInteractive

      - name: Decode Windows release-signing certificate
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PATH: ${{ runner.temp }}\natsx-release-signing.pfx
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PFX_BASE64)) {
            throw "WINDOWS_SIGNING_PFX_BASE64 is not configured."
          }

          [IO.File]::WriteAllBytes(
            $env:WINDOWS_SIGNING_PFX_PATH,
            [Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX_BASE64)
          )

      - name: Restore
        run: dotnet restore windows/Natsx.Controller.slnx

      - name: Test
        run: dotnet test windows/Natsx.Controller.slnx --configuration Release --no-restore --verbosity normal

      - name: Publish Windows Receiver
        shell: pwsh
        run: dotnet publish windows/src/Natsx.Controller.Receiver/Natsx.Controller.Receiver.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/windows-receiver

      - name: Sign Windows Receiver binaries
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_PATH: ${{ runner.temp }}\natsx-release-signing.pfx
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PFX_PASSWORD) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_TIMESTAMP_URL)) {
            throw "Windows Authenticode signing password/timestamp URL is not fully configured."
          }

          ./windows/eng/sign-windows-release.ps1 -TargetPath artifacts/windows-receiver -PfxPath $env:WINDOWS_SIGNING_PFX_PATH -PfxPassword $env:WINDOWS_SIGNING_PFX_PASSWORD -TimestampUrl $env:WINDOWS_TIMESTAMP_URL

      - name: Archive Windows Receiver validation build
        shell: pwsh
        run: Compress-Archive -Path artifacts/windows-receiver/* -DestinationPath artifacts/natsx-controller-windows-x64.zip

      - name: Fetch Microsoft production USB driver bundle
        shell: pwsh
        env:
          DRIVER_BUNDLE_URL: ${{ vars.NATSX_PRODUCTION_DRIVER_BUNDLE_URL }}
          DRIVER_BUNDLE_SHA256: ${{ vars.NATSX_PRODUCTION_DRIVER_BUNDLE_SHA256 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DRIVER_BUNDLE_URL) -or
              [string]::IsNullOrWhiteSpace($env:DRIVER_BUNDLE_SHA256)) {
            throw "Production driver bundle variables are not configured. Feature-complete release is blocked by design."
          }

          $zip = Join-Path $env:RUNNER_TEMP "natsx-production-drivers.zip"
          Invoke-WebRequest -Uri $env:DRIVER_BUNDLE_URL -OutFile $zip -UseBasicParsing

          $actual = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = $env:DRIVER_BUNDLE_SHA256.Trim().ToLowerInvariant()

          if ($actual -ne $expected) {
            throw "Production driver bundle SHA-256 mismatch. Expected $expected, got $actual."
          }

          $destination = "artifacts/windows-drivers-production"
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          Expand-Archive -LiteralPath $zip -DestinationPath $destination -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --version 6.7.1 --no-progress -y

      - name: Build feature-complete Windows installer
        shell: pwsh
        run: ./windows/installer/build-installer.ps1

      - name: Sign Windows installer
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_PATH: ${{ runner.temp }}\natsx-release-signing.pfx
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          $installers = @(Get-ChildItem artifacts/installer -Filter *.exe -File)

          if ($installers.Count -ne 1) {
            throw "Expected exactly one Windows installer, found $($installers.Count)."
          }

          ./windows/eng/sign-windows-release.ps1 -TargetPath $installers[0].FullName -PfxPath $env:WINDOWS_SIGNING_PFX_PATH -PfxPassword $env:WINDOWS_SIGNING_PFX_PASSWORD -TimestampUrl $env:WINDOWS_TIMESTAMP_URL

      - name: Write Windows SHA-256 checksums
        shell: pwsh
        run: |
          $files = @(
            Get-Item artifacts/natsx-controller-windows-x64.zip
            Get-ChildItem artifacts/installer -Filter *.exe -File
          )

          foreach ($file in $files) {
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)" | Set-Content -LiteralPath ($file.FullName + ".sha256") -Encoding ascii
          }

      - name: Upload Windows Receiver validation build
        uses: actions/upload-artifact@v4
        with:
          name: natsx-controller-windows-x64-validation
          path: |
            artifacts/natsx-controller-windows-x64.zip
            artifacts/natsx-controller-windows-x64.zip.sha256
          if-no-files-found: error

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: natsx-controller-windows-installer
          path: |
            artifacts/installer/*.exe
            artifacts/installer/*.exe.sha256
          if-no-files-found: error

      - name: Remove Windows release-signing certificate
        if: always()
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_PATH: ${{ runner.temp }}\natsx-release-signing.pfx
        run: Remove-Item -LiteralPath $env:WINDOWS_SIGNING_PFX_PATH -Force -ErrorAction SilentlyContinue


  publish-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - android-release
      - windows-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Android release artifact
        uses: actions/download-artifact@v4
        with:
          name: natsx-controller-android-release
          path: release/android

      - name: Download Windows installer artifact
        uses: actions/download-artifact@v4
        with:
          name: natsx-controller-windows-installer
          path: release/windows

      - name: Verify published checksums
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r checksum; do
            directory="$(dirname "$checksum")"
            filename="$(basename "$checksum")"
            (
              cd "$directory"
              sha256sum -c "$filename"
            )
          done < <(find release -type f -name '*.sha256' -print | sort)

          apk_count="$(find release/android -maxdepth 1 -type f -name '*.apk' | wc -l | tr -d ' ')"
          installer_count="$(find release/windows -maxdepth 1 -type f -name '*.exe' | wc -l | tr -d ' ')"

          test "$apk_count" = "1"
          test "$installer_count" = "1"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mapfile -t files < <(
            find release/android release/windows -maxdepth 1 -type f \
              \( -name '*.apk' -o -name '*.exe' -o -name '*.sha256' \) \
              -print | sort
          )

          gh release create "${GITHUB_REF_NAME}" "${files[@]}" \
            --verify-tag \
            --title "NATSX Controller ${GITHUB_REF_NAME#v}" \
            --generate-notes
