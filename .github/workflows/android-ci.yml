name: Android CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Android lint
        run: gradle -p android :app:lintDebug --stacktrace

      - name: Print Android lint report on failure
        if: failure()
        shell: bash
        run: |
          report="android/app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          if [ -f "$report" ]; then
            cat "$report"
          fi

      - name: Test
        run: gradle -p android :app:testDebugUnitTest --stacktrace

      - name: Assemble debug
        run: gradle -p android :app:assembleDebug --stacktrace

      - name: Upload Android debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: natsx-controller-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
