name: Android CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Verify production Android signing guard
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/natsx-missing-release-signing.txt"
          if gradle -p android :app:assembleRelease --stacktrace > "$log" 2>&1; then
            echo "Unsigned production build unexpectedly succeeded" >&2
            exit 1
          fi
          grep -Fq "Android release signing is not configured" "$log"
          store="$RUNNER_TEMP/natsx-signing-guard-test.keystore"
          keytool -genkeypair -noprompt -keystore "$store" -storepass fixturepass -keypass fixturepass -alias debug-subject -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 365
          if NATSX_RELEASE_STORE_FILE="$store" NATSX_RELEASE_STORE_PASSWORD=fixturepass NATSX_RELEASE_KEY_ALIAS=debug-subject NATSX_RELEASE_KEY_PASSWORD=fixturepass gradle -p android :app:verifyReleaseSigning > "$log" 2>&1; then
            echo "Android Debug subject was accepted for production" >&2
            exit 1
          fi
          grep -Fq "Android Debug signing identities cannot be used" "$log"
          keytool -genkeypair -noprompt -keystore "$store" -storepass fixturepass -keypass fixturepass -alias release-fixture -dname "CN=NATSX Nonshipping CI Fixture" -keyalg RSA -keysize 2048 -validity 365
          NATSX_RELEASE_STORE_FILE="$store" NATSX_RELEASE_STORE_PASSWORD=fixturepass NATSX_RELEASE_KEY_ALIAS=release-fixture NATSX_RELEASE_KEY_PASSWORD=fixturepass gradle -p android :app:verifyReleaseSigning
          rm -f "$store" "$log"

      - name: Android lint
        run: gradle -p android :app:lintDebug --stacktrace

      - name: Print Android lint report on failure
        if: failure()
        shell: bash
        run: |
          report="android/app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          if [ -f "$report" ]; then
            cat "$report"
          fi

      - name: Test
        run: gradle -p android :app:testDebugUnitTest --stacktrace

      - name: Assemble debug
        run: gradle -p android :app:assembleDebug --stacktrace

      - name: Upload Android debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: natsx-controller-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Android signing tooling for verified local update signing
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: natsx-android-signing-tooling
          path: ${{ env.ANDROID_HOME }}/build-tools/36.0.0/lib/apksigner.jar
          if-no-files-found: error
