name: HIDMaestro Bootstrap CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
    paths:
      - "windows/src/Natsx.Controller.VirtualGamepad/**"
      - "windows/eng/fetch-hidmaestro.ps1"
      - "Directory.Build.props"
      - ".github/workflows/hidmaestro-bootstrap-ci.yml"
  pull_request:
    paths:
      - "windows/src/Natsx.Controller.VirtualGamepad/**"
      - "windows/eng/fetch-hidmaestro.ps1"
      - "Directory.Build.props"
      - ".github/workflows/hidmaestro-bootstrap-ci.yml"

permissions:
  contents: read

jobs:
  clean-bootstrap:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore windows/src/Natsx.Controller.VirtualGamepad/Natsx.Controller.VirtualGamepad.csproj

      - name: Validate clean HIDMaestro auto-bootstrap
        shell: pwsh
        run: |
          Remove-Item windows/lib/HIDMaestro -Recurse -Force -ErrorAction SilentlyContinue
          dotnet build windows/src/Natsx.Controller.VirtualGamepad/Natsx.Controller.VirtualGamepad.csproj --configuration Release --no-restore
          if (-not (Test-Path windows/lib/HIDMaestro/HIDMaestro.Core.dll)) {
            throw "HIDMaestro auto-bootstrap did not materialize HIDMaestro.Core.dll."
          }
