name: Windows CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
    paths:
      - "windows/**"
      - "Directory.Build.props"
      - "VERSION"
      - ".github/workflows/windows-ci.yml"
  pull_request:
    paths:
      - "windows/**"
      - "Directory.Build.props"
      - "VERSION"
      - ".github/workflows/windows-ci.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Parse Windows PowerShell tooling
        shell: pwsh
        run: |
          $failed = $false
          @(
            Get-ChildItem windows/eng -Filter *.ps1 -File
            Get-ChildItem windows/installer -Filter *.ps1 -File
            Get-ChildItem windows/driver -Filter *.ps1 -File
            Get-ChildItem windows/driver/aoa-bootstrap -Filter *.ps1 -File
            Get-ChildItem windows/driver/aoa-winusb -Filter *.ps1 -File
          ) | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object {
                Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)"
              }
            }
          }

          if ($failed) {
            throw "PowerShell syntax validation failed."
          }

      - name: Enforce installer driver-removal safety
        shell: pwsh
        run: |
          $cleanup = Get-Content windows/installer/remove-production-usb-drivers.ps1 -Raw

          if ($cleanup -match '(?i)/force') {
            throw "Production USB driver cleanup must never use pnputil /force."
          }

      - name: Cache HIDMaestro SDK
        uses: actions/cache@v4
        with:
          path: windows/lib/HIDMaestro
          key: hidmaestro-v1.9.2-1c19e9a34360652a8f98c595ff6c03c1f1fd4c027f180cc4d1149e3d352643d7

      - name: Fetch HIDMaestro SDK
        shell: pwsh
        run: ./windows/eng/fetch-hidmaestro.ps1

      - name: Restore
        run: dotnet restore windows/Natsx.Controller.slnx

      - name: Reject newly introduced whitespace errors
        shell: pwsh
        run: |
          git diff --check HEAD~1 HEAD

      - name: Build
        run: dotnet build windows/Natsx.Controller.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test windows/Natsx.Controller.slnx --configuration Release --no-build --verbosity normal

      - name: Publish Receiver for installer smoke test
        shell: pwsh
        run: dotnet publish windows/src/Natsx.Controller.Receiver/Natsx.Controller.Receiver.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/windows-receiver-ci

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --version 6.7.1 --no-progress -y

      - name: Compile non-shipping Windows installer
        shell: pwsh
        run: ./windows/installer/build-installer.ps1 -PublishDir "artifacts/windows-receiver-ci" -OutputDir "artifacts/installer-ci" -AllowMissingProductionUsbDrivers

      - name: Exercise installer lifecycle
        shell: pwsh
        run: |
          $installer = @(
            Get-ChildItem artifacts/installer-ci -Filter *.exe -File
          )

          if ($installer.Count -ne 1) {
            throw "Expected exactly one CI installer, found $($installer.Count)."
          }

          $installRoot = Join-Path $env:RUNNER_TEMP "natsx-controller-installed"

          $trustRoot = Join-Path $env:LOCALAPPDATA "NATSX\Controller"
          $trustedPeers = Join-Path $trustRoot "trusted-peers-v1.json"
          $localPeerIdentity = Join-Path $trustRoot "local-peer-id-v1.txt"
          New-Item -ItemType Directory -Path $trustRoot -Force | Out-Null
          Set-Content -LiteralPath $trustedPeers -Value '{"ci":"preserve-trust"}' -Encoding UTF8
          Set-Content -LiteralPath $localPeerIdentity -Value 'ci-preserve-identity' -Encoding UTF8
          $trustedPeersHash = (Get-FileHash -LiteralPath $trustedPeers -Algorithm SHA256).Hash
          $localPeerIdentityHash = (Get-FileHash -LiteralPath $localPeerIdentity -Algorithm SHA256).Hash

          $install = Start-Process -FilePath $installer[0].FullName -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/SP-",
            "/DIR=$installRoot"
          ) -Wait -PassThru

          if ($install.ExitCode -ne 0) {
            $setupLog = Join-Path $env:ProgramData "NATSX\Controller\setup-driver-error.log"

            if (Test-Path -LiteralPath $setupLog) {
              Get-Content -LiteralPath $setupLog | Write-Host
            }

            throw "CI installer exited with code $($install.ExitCode)."
          }

          $receiver = Join-Path $installRoot "Natsx.Controller.Receiver.exe"

          if (-not (Test-Path -LiteralPath $receiver -PathType Leaf)) {
            throw "Receiver executable was not installed."
          }

          $uninstaller = @(
            Get-ChildItem $installRoot -Filter "unins*.exe" -File
          ) | Select-Object -First 1

          if ($null -eq $uninstaller) {
            throw "Inno Setup uninstaller was not created."
          }

          $receiverSettingsKey = "HKCU:\Software\NATSX\Controller Receiver"
          $runKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run"
          New-Item -Path $receiverSettingsKey -Force | Out-Null
          New-ItemProperty -Path $receiverSettingsKey -Name "CloseToTray" -Value 0 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path $runKey -Name "NATSX Controller Receiver" -Value '"C:\ci\Natsx.Controller.Receiver.exe" --background' -PropertyType String -Force | Out-Null

          $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART"
          ) -Wait -PassThru

          if ($uninstall.ExitCode -ne 0) {
            throw "CI uninstaller exited with code $($uninstall.ExitCode)."
          }

          Start-Sleep -Milliseconds 500

          if (Test-Path -LiteralPath $receiver) {
            throw "Receiver executable remained after uninstall."
          }

          if (-not (Test-Path -LiteralPath $trustedPeers -PathType Leaf) -or
              -not (Test-Path -LiteralPath $localPeerIdentity -PathType Leaf)) {
            throw "Normal uninstall removed pairing/trust identity data."
          }

          if ((Get-FileHash -LiteralPath $trustedPeers -Algorithm SHA256).Hash -ne $trustedPeersHash -or
              (Get-FileHash -LiteralPath $localPeerIdentity -Algorithm SHA256).Hash -ne $localPeerIdentityHash) {
            throw "Normal uninstall modified pairing/trust identity data."
          }

          if (Test-Path -LiteralPath $receiverSettingsKey) {
            throw "Receiver UI settings registry key remained after uninstall."
          }

          $runValue = (Get-ItemProperty -Path $runKey -Name "NATSX Controller Receiver" -ErrorAction SilentlyContinue)."NATSX Controller Receiver"

          if (-not [string]::IsNullOrWhiteSpace([string]$runValue)) {
            throw "Receiver Startup registry entry remained after uninstall."
          }

          Remove-Item -LiteralPath $trustRoot -Recurse -Force -ErrorAction SilentlyContinue
