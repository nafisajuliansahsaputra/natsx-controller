name: Windows CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
    paths:
      - "windows/**"
      - "Directory.Build.props"
      - ".github/workflows/windows-ci.yml"
  pull_request:
    paths:
      - "windows/**"
      - "Directory.Build.props"
      - ".github/workflows/windows-ci.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore windows/Natsx.Controller.slnx

      - name: Build
        run: dotnet build windows/Natsx.Controller.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test windows/Natsx.Controller.slnx --configuration Release --no-build --verbosity normal
