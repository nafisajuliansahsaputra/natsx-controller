name: Production release input audit
on:
  workflow_dispatch:
  push:
    branches: [main, "fix/**", "feat/**"]
    paths: ["tools/*release_readiness.py", ".github/workflows/release*.yml", "docs/release/**", "VERSION", "VERSION_CODE", "LICENSE", "CHANGELOG.md"]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test release input validator
        run: python3 -m unittest discover -s tools -p 'test_release_readiness.py'
      - name: Inventory configured release inputs
        env:
          RELEASE_SHA: ${{ github.sha }}
          NATSX_INNO_LICENSE_CONFIRMED: ${{ vars.NATSX_INNO_LICENSE_CONFIRMED }}
          NATSX_PHYSICAL_RELEASE_APPROVED_SHA: ${{ vars.NATSX_PHYSICAL_RELEASE_APPROVED_SHA }}
          NATSX_PRODUCTION_DRIVER_BUNDLE_URL: ${{ vars.NATSX_PRODUCTION_DRIVER_BUNDLE_URL }}
          NATSX_PRODUCTION_DRIVER_BUNDLE_SHA256: ${{ vars.NATSX_PRODUCTION_DRIVER_BUNDLE_SHA256 }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
          HAS_ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          HAS_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
          HAS_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS != '' }}
          HAS_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD != '' }}
          HAS_WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 != '' }}
          HAS_WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD != '' }}
        run: python3 tools/release_readiness.py --output artifacts/release-input-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: natsx-production-release-input-audit
          path: artifacts/release-input-audit.*
