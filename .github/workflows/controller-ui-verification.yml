name: Controller UI verification
on:
  push:
    branches: ["feat/reference-controller-skin"]
    paths: ["android/**", ".github/workflows/controller-ui-verification.yml"]
permissions:
  contents: read
jobs:
  native-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - run: gradle -p android :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: |
            adb install android/app/build/outputs/apk/debug/app-debug.apk
            adb install android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w com.natsx.controller.test/com.natsx.controller.SkinVerificationInstrumentation | tee instrumentation.txt
            grep -q 'PASS: native rendering' instrumentation.txt
            adb pull /sdcard/Android/data/com.natsx.controller/files/skin-verification ui-verification
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: controller-ui-verification
          path: |
            ui-verification/
            instrumentation.txt
